name: Cloudflare

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      MEDARBEJDERE_JSON:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.CF_TOKEN != ''
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
        if: env.CF_TOKEN != ''
      - run: node --test hosting/cloudflare/*.test.ts
        if: env.CF_TOKEN != ''
      - name: Byg offentlig udgave
        if: env.CF_TOKEN != ''
        run: node tools/build-udgave.ts offentlig
      - name: Kontrollér Cloudflare Access
        if: env.CF_TOKEN != ''
        id: access
        run: node hosting/cloudflare/check-access.ts
      - name: Byg intern udgave med kartotek
        if: env.CF_TOKEN != '' && steps.access.outputs.enabled == 'true'
        run: node tools/build-udgave.ts intern
        env:
          MEDARBEJDERE_JSON: ${{ secrets.MEDARBEJDERE_JSON }}
      - name: Byg intern udgave uden kartotek
        if: env.CF_TOKEN != '' && steps.access.outputs.enabled != 'true'
        run: |
          echo "::warning::Cloudflare Access er ikke slået til; det indbyggede kartotek er udeladt."
          node tools/build-udgave.ts intern
      - name: Kontrollér filstørrelser for hosting
        if: env.CF_TOKEN != ''
        run: |
          node hosting/cloudflare/check-assets.ts dist-intern
          node hosting/cloudflare/check-assets.ts dist-offentlig
      - name: Udrul intern udgave
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --config hosting/cloudflare/wrangler.jsonc
      - name: Udrul offentlig udgave
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --config hosting/cloudflare/wrangler-offentlig.jsonc
      - name: Ingen API-nøgle
        if: env.CF_TOKEN == ''
        run: echo "Ingen API-nøgle; hosting springes over. Appkontrollen er uafhængig."
