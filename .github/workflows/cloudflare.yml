name: Cloudflare

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.CF_TOKEN != ''
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
        if: env.CF_TOKEN != ''
      - run: node --test hosting/cloudflare/*.test.ts
        if: env.CF_TOKEN != ''
      - run: npm run build
        if: env.CF_TOKEN != ''
        env:
          VITE_UDGAVE: delt
      - name: Kontrollér filstørrelser for hosting
        if: env.CF_TOKEN != ''
        run: node hosting/cloudflare/check-assets.ts
      - name: Udrul den byggede app
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --config hosting/cloudflare/wrangler.jsonc
      - name: Ingen API-nøgle
        if: env.CF_TOKEN == ''
        run: echo "Ingen API-nøgle; hosting springes over. Appkontrollen er uafhængig."
