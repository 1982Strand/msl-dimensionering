name: Beregningsmotor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference:
    name: TypeScript-reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Rapporttesten (B-049) læser PDF-teksten med pdftotext; Windows-billedet har det i forvejen.
      - name: Installer pdftotext
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run test:browser
