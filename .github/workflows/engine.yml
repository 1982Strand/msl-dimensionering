name: Beregningsmotor

on:
  pull_request:
  push:
    branches: [main]
  # B-075: start en kørsel (og dermed udrulningen) manuelt, fx efter at nøglen er sat.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: TypeScript-reference (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Rapporttesten (B-049) læser PDF-teksten med pdftotext; Windows-billedet har det i forvejen.
      - name: Installer pdftotext
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run test:browser

  # B-075: den delte udgave i Azure Static Web Apps. Kun fra main og kun når alle tests består.
  # Indtil udrulningsnøglen er sat som hemmelighed i GitHub, springes udrulningen over.
  azure:
    name: Udrul til Azure
    needs: reference
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.AZURE_TOKEN != ''
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.AZURE_TOKEN != ''
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
        if: env.AZURE_TOKEN != ''
      # B-076: den delte udgave starter med låst firmaprofil, indtil rollerne er hentet.
      - run: npm run build
        if: env.AZURE_TOKEN != ''
        env:
          VITE_UDGAVE: delt
      - name: Udrul den byggede app
        if: env.AZURE_TOKEN != ''
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
      - name: Ingen udrulningsnøgle
        if: env.AZURE_TOKEN == ''
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN er ikke sat; udrulningen til Azure springes over."

  # B-077: den delte udgave i Cloudflare Pages bag Cloudflare Access (login med kode på mail).
  # Kører ved siden af Azure; springes over, indtil API-nøglen er sat i GitHub.
  cloudflare:
    name: Udrul til Cloudflare
    needs: reference
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.CF_TOKEN != ''
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
        if: env.CF_TOKEN != ''
      - run: npm run build
        if: env.CF_TOKEN != ''
        env:
          VITE_UDGAVE: delt
      # Admin-adresserne (B-076) fra GitHub-variablen ADMIN_EMAILS, adskilt af komma.
      - name: Admin-adresser
        if: env.CF_TOKEN != ''
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: >-
          node -e "const a = (process.env.ADMIN_EMAILS || '').split(/[,;\s]+/).map((s) => s.trim().toLowerCase()).filter(Boolean);
          require('node:fs').writeFileSync('dist/adgang.json', JSON.stringify({ admins: a }));
          console.log('admin-adresser:', a.length);"
      - name: Udrul den byggede app
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=msl-dimensionering --branch=main --commit-dirty=true
      - name: Ingen API-nøgle
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN er ikke sat; udrulningen til Cloudflare springes over."
