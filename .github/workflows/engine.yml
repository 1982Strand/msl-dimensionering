name: Appkontrol

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Kun den seneste version af samme pull request testes. Main afbrydes ikke midt i.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Beregninger og brugerforløb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Rapporttesten læser PDF-teksten med pdftotext.
      - name: Installer pdftotext
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run test:browser

  # Valgfri hosting. Fjern dette job og cloudflare.yml ved skift af udbyder.
  cloudflare:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cloudflare.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
